<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>93域名收藏</title>
    
    <script src="https://cdn.tailwindcss.com">
    </script>
    <style>
        /* 背景图固定 */
        .bg-fixed-img {
            background-image: url('https://i.ibb.co/vvj83b6Q/IMG-4895.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* 文字金渐变 */
        .text-gradient-gold {
            background: linear-gradient(135deg, #f9e05d 0%, #f5b342 50%, #ffd966 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 磨砂玻璃卡 */
        .glass-card {
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.30);
            transform: translateY(-2px);
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.45);
        }

        /* 友链图标悬停 */
        .friend-icon {
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .friend-icon:hover {
            transform: scale(1.08);
            border-color: rgba(255, 255, 255, 0.7);
        }

        /* 淡入动画 */
        @keyframes fadeInDown {
            0% {
                opacity: 0;
                transform: translateY(-30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-down {
            animation: fadeInDown 0.9s ease-out forwards;
        }
        .animate-fade-up {
            animation: fadeInUp 0.9s ease-out 0.2s forwards;
        }
        .animate-fade-up-delay {
            animation: fadeInUp 0.9s ease-out 0.4s forwards;
        }
        .opacity-0 {
            opacity: 0;
        }
    </style>
</head>
<body>

    
    <div class="fixed inset-0 -z-10 bg-fixed-img bg-cover bg-center bg-no-repeat">
        
        <div class="absolute inset-0 bg-black/35"></div>
    </div>

    
    <div class="relative z-10 flex flex-col justify-between items-center min-h-screen w-full px-6 py-8 text-center text-white">

        
        <div class="flex-1 flex flex-col justify-center items-center w-full animate-fade-down opacity-0">
            <h1 class="text-[clamp(3.2rem,12vw,6.5rem)] font-extrabold tracking-wide leading-tight text-gradient-gold drop-shadow-[0_4px_40px_rgba(245,179,66,0.35)]">
                93域名收藏
            </h1>
            <p class="text-[clamp(1.2rem,3.5vw,2rem)] font-light tracking-[0.3em] mt-1 text-white/95 drop-shadow-[0_2px_20px_rgba(0,0,0,0.5)]">
                ✨ 这是我的收藏域名哦！
            </p>
        </div>

        
        <div class="flex-shrink-0 w-full max-w-[540px] mb-4 animate-fade-up-delay opacity-0">
            
            <div class="glass-card rounded-2xl px-5 py-5 md:px-8 md:py-6 shadow-2xl">

                
                <p class="text-xs md:text-sm font-light tracking-[0.2em] text-white/50 uppercase mb-4">
                    🔗 友情链接
                </p>

                
                <div class="flex items-center justify-center gap-4 md:gap-8 flex-wrap">

                    
                    <a href="https://www.bilibili.com/blackboard/open-space-app.html?mid=3461577822963830" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center gap-1.5 px-1 py-1 rounded-xl transition-all duration-200 hover:opacity-90 no-underline text-white/90">
                    <img src="https://i.ibb.co/FbN7hXxJ/IMG-4893.jpg" alt="Bilibili" loading="lazy" class="w-11 h-11 md:w-14 md:h-14 rounded-full object-cover border-2 border-white/30 shadow-lg friend-icon"/>
                    <span class="text-[0.6rem] md:text-[0.75rem] font-light tracking-widest text-white/70">Bilibili</span>
                </a>

                
                <div class="w-px h-9 md:h-12 bg-white/15"></div>

                
                <a href="https://youtube.com/@no.01lingyi?si=DYLOJg5OBgNy2qZr" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center gap-1.5 px-1 py-1 rounded-xl transition-all duration-200 hover:opacity-90 no-underline text-white/90">
                <img src="https://i.ibb.co/V0STCc8n/IMG-4894.jpg" alt="YouTube" loading="lazy" class="w-11 h-11 md:w-14 md:h-14 rounded-full object-cover border-2 border-white/30 shadow-lg friend-icon"/>
                <span class="text-[0.6rem] md:text-[0.75rem] font-light tracking-widest text-white/70">YouTube</span>
            </a>

            
            <div class="w-px h-9 md:h-12 bg-white/15"></div>

            
            <a href="https://bloggy.ccwu.cc" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center gap-1.5 px-1 py-1 rounded-xl transition-all duration-200 hover:opacity-90 no-underline text-white/90">
            <img src="https://i.ibb.co/qMk3FYQr/IMG-4833.jpg" alt="Bloggy" loading="lazy" class="w-11 h-11 md:w-14 md:h-14 rounded-full object-cover border-2 border-white/30 shadow-lg friend-icon"/>
            <span class="text-[0.6rem] md:text-[0.75rem] font-light tracking-widest text-white/70">Bloggy</span>
        </a>

    </div>
</div>


<p class="mt-2 text-[0.6rem] md:text-[0.65rem] tracking-[0.15em] text-white/20 select-none">
    · 93  ·  域名收藏  ·
</p>
</div>

</div>

</body>
</html>
