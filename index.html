<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>神经人专属ID站点</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 纯青蓝背景，无渐变 */
            background-color: #00838F;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            padding: 20px;
        }

        /* 主卡片 —— 纯色白底 */
        .card {
            max-width: 560px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.94);
            border-radius: 48px;
            padding: 40px 36px 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: scale(1.01);
        }

        /* 头像 —— 显示尺寸 120px，您可自由调整 */
        .avatar-wrapper {
            margin-bottom: 18px;
        }

        .avatar-wrapper img {
            width: 120px;           /* 修改此处可调整大小 */
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00BCD4;
            box-shadow: 0 4px 12px rgba(0, 188, 212, 0.25);
            display: block;
            margin: 0 auto;
        }

        /* 标题 */
        .brand {
            margin-bottom: 30px;
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 700;
            color: #006064;
            letter-spacing: 2px;
        }

        .brand .sub {
            font-size: 14px;
            color: #00838F;
            letter-spacing: 6px;
            font-weight: 300;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .divider {
            width: 60px;
            height: 2px;
            margin: 14px auto 0;
            background-color: #00BCD4;
            border-radius: 4px;
        }

        /* 按钮 —— 纯色，无渐变 */
        .link-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 8px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 16px 24px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            color: #fff;
            background-color: #00BCD4;
            border: none;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .btn .logo {
            font-size: 26px;
            line-height: 1;
            flex-shrink: 0;
        }

        .btn .label {
            flex: 1;
            text-align: center;
        }

        .btn .badge {
            font-size: 12px;
            font-weight: 400;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 2px 14px;
            border-radius: 40px;
            color: #fff;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .btn-bilibili {
            background-color: #00ACC1;
        }
        .btn-bilibili:hover {
            background-color: #0097A7;
            transform: translateY(-2px);
        }

        .btn-youtube {
            background-color: #26C6DA;
        }
        .btn-youtube:hover {
            background-color: #00BCD4;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #80DEEA;
            letter-spacing: 2px;
            border-top: 1px solid #E0F7FA;
            padding-top: 20px;
        }
        .footer span {
            color: #006064;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 18px 24px;
                border-radius: 32px;
            }
            .brand h1 {
                font-size: 22px;
            }
            .btn {
                font-size: 16px;
                padding: 14px 18px;
            }
            .btn .logo {
                font-size: 22px;
            }
            .btn .badge {
                font-size: 10px;
                padding: 0 10px;
            }
            .avatar-wrapper img {
                width: 90px;    /* 移动端稍小 */
                height: 90px;
            }
        }
    </style>
</head>
